# Paid compute: review the current Render quote before applying this blueprint.
services:
  - type: web
    name: mirrorcheck-demo
    runtime: docker
    repo: https://github.com/Nurzhan-Zhumabekov/META
    branch: main
    plan: 2c-4g
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    disk:
      name: mirrorcheck-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: COMPARER
        value: meta
      - key: REQUIRE_META
        value: "true"
      - key: META_MODEL
        value: muse-spark-1.3
      - key: META_API_KEY
        sync: false
      - key: META_MAX_CALLS_PER_HOUR
        value: "10"
      - key: META_MAX_CALLS_PER_OWNER_PER_HOUR
        value: "2"
      - key: DATA_DIR
        value: /var/data
